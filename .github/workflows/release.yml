name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: version
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.v.outputs.ship }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is this version already released
        id: v
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already out, nothing to ship"
            echo "ship=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is new, shipping"
            echo "ship=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.target }}
    needs: check
    if: needs.check.outputs.ship == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package ghdeck

      - name: Package
        run: |
          name=ghdeck-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/${{ matrix.target }}/release ghdeck
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -lh "$name.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ghdeck-${{ matrix.target }}
          path: |
            ghdeck-*.tar.gz
            ghdeck-*.tar.gz.sha256

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums in one file
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  tap:
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: jitendravjh/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Rebuild the formula
        run: bash script/formula.sh "${{ needs.check.outputs.tag }}" > tap/Formula/ghdeck.rb

      - name: Push it
        working-directory: tap
        run: |
          if git diff --quiet Formula/ghdeck.rb; then
            echo "tap already on ${{ needs.check.outputs.tag }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ghdeck ${{ needs.check.outputs.tag }}" Formula/ghdeck.rb
          git push

  # windows builds after the release is out and may fail without holding up anything above
  windows:
    needs: [check, release]
    runs-on: windows-latest
    continue-on-error: true
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup update stable --no-self-update

      - name: Build
        run: cargo build --release --locked --package ghdeck

      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "ghdeck-x86_64-pc-windows-msvc"
          Compress-Archive -Path target/release/ghdeck.exe -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value "$hash  $name.zip" -NoNewline -Encoding ascii
          gh release upload "${{ needs.check.outputs.tag }}" "$name.zip" "$name.zip.sha256" --clobber
