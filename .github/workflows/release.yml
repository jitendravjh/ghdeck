name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package ghwork

      - name: Package
        run: |
          name=ghwork-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/${{ matrix.target }}/release ghwork
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -lh "$name.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ghwork-${{ matrix.target }}
          path: |
            ghwork-*.tar.gz
            ghwork-*.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums in one file
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -l

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  tap:
    needs: release
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out which tag to publish
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
          else
            tag=${GITHUB_REF_NAME}
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: jitendravjh/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Rebuild the formula
        run: bash script/formula.sh "${{ steps.tag.outputs.tag }}" > tap/Formula/ghwork.rb

      - name: Push it
        working-directory: tap
        run: |
          if git diff --quiet Formula/ghwork.rb; then
            echo "tap already on ${{ steps.tag.outputs.tag }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "ghwork ${{ steps.tag.outputs.tag }}" Formula/ghwork.rb
          git push
