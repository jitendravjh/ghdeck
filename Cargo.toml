[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jitendravjh/ghdeck"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
